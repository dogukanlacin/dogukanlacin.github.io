# Doğukan'ın Notları — Pages CMS Yapılandırması
# Resmî Dokümantasyon: https://pagescms.org/docs/configuration/

actions:
  - name: deploy-site
    label: "Siteyi Yayınla"
    workflow: "publish.yml"
    ref: "current"
    confirm:
      title: "Site Canlıya Alınsın mı?"
      message: "Blog yazıları derlenecek ve GitHub Pages üzerinde yayımlanacaktır."
      button: "Yayınla"

media:
  input: assets/images/posts
  output: /assets/images/posts
  categories: [image]
  extensions: [jpg, jpeg, png, webp, svg, gif, avif, JPG, JPEG, PNG, WEBP, SVG, GIF, AVIF]

content:
  - name: posts
    label: Blog Yazıları
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Yazı Başlığı
        type: string
        description: Yazının ana editoryal başlığı (İsteğe bağlı)

      - name: excerpt
        label: Kısa Açıklama / Alt Başlık
        type: text
        description: Yazının edebi özeti veya giriş cümlesi (İsteğe bağlı)

      - name: date
        label: Yayın Tarihi
        type: date
        description: Yazının okuyucuya görüneceği tarih (İsteğe bağlı, boşsa bugünün tarihi kullanılır)

      - name: coverImage
        label: Kapak Görseli
        type: image
        description: Yazı kapak görseli (İsteğe bağlı, boyutu ve en-boy oranı ne olursa olsun kesilmeden tam yüklenir)

      - name: imageAlt
        label: Kapak Görseli Betimlemesi (Alt Metni)
        type: string
        description: Ekran okuyucular ve arama motorları için görsel açıklaması (İsteğe bağlı)

      - name: featured
        label: Öne Çıkan Yazı
        type: boolean
        default: false
        description: Bu yazıyı ana sayfanın en üstünde öne çıkar

      - name: seoTitle
        label: SEO Başlığı
        type: string
        description: Arama motoru ve sosyal paylaşımlar için özel başlık (İsteğe bağlı, boşsa yazı başlığı kullanılır)

      - name: seoDescription
        label: SEO Açıklaması
        type: text
        description: Arama motoru ve sosyal paylaşımlar için özel açıklama (İsteğe bağlı, boşsa kısa açıklama kullanılır)

      - name: body
        label: Yazı İçeriği
        type: rich-text
        description: Yazının ana metni (İsteğe bağlı)
        options:
          format: markdown
          switcher: true
